name: BeebPab
options:
  bundleIdPrefix: com.beebpab
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: th
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  BeebPab:
    type: application
    platform: macOS
    sources:
      - path: BeebPab
      - path: presets/presets.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beebpab.app
        PRODUCT_NAME: BeebPab
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BeebPab
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: BeebPab/BeebPab.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - BeebPabTests
  BeebPabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: BeebPabTests
    dependencies:
      - target: BeebPab
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.beebpab.app.tests
        CODE_SIGN_IDENTITY: "-"
